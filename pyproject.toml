[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["build_zip", "check_env", "conftest", "coverage", "extract_text", "pdf_checks",
                     "release", "relevance_score", "render_resume_pdf", "resume_text", "scoreboard",
                     "slop_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
