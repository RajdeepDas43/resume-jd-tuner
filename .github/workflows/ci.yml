name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The Release workflow runs this whole file on the tagged commit before it publishes anything.
  workflow_call:
  schedule:
    # Weekly, so a new release of a dependency that breaks something shows up even when nothing
    # in this repository changed.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run for the previous push; nothing else is cancelled.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the tools
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: actionlint (workflow syntax and the shell in run steps)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: zizmor (workflow security)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows

      - name: Dependabot config schema (a typo there would silently stop updates)
        run: check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.deps == 'minimum' && ', oldest dependencies' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux with poppler and LaTeX: every test runs, none may be skipped.
          # Pinned to 24.04 because Python 3.9 has no builds for newer runner images.
          - { os: ubuntu-24.04, python: "3.9", tools: full }
          - { os: ubuntu-24.04, python: "3.13", tools: full }
          - { os: ubuntu-24.04, python: "3.14", tools: full }
          - { os: ubuntu-24.04, python: "3.15", tools: full }
          # The oldest versions that requirements.txt allows.
          - { os: ubuntu-24.04, python: "3.9", tools: full, deps: minimum }
          # macOS with poppler; Windows with neither tool, which tests the fallbacks.
          - { os: macos-latest, python: "3.13", tools: poppler }
          - { os: windows-latest, python: "3.13", tools: none }
    env:
      # Turns "tool not installed" skips into failures where the tools should be present.
      RJT_REQUIRE_TOOLS: ${{ matrix.tools == 'full' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install poppler and a minimal LaTeX
        if: matrix.tools == 'full'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 poppler-utils texlive-latex-base

      - name: Install poppler
        if: matrix.tools == 'poppler'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install poppler

      - name: Install the Python packages
        shell: bash
        env:
          DEPS: ${{ matrix.deps }}
        run: |
          dev=requirements-dev.txt
          if python -c 'import sys; sys.exit(0 if sys.version_info < (3, 10) else 1)'; then
            dev=ci/python3.9/requirements-dev.txt  # pytest 9 needs Python 3.10+
          fi
          if [ "$DEPS" = "minimum" ]; then
            # Same packages as requirements.txt, each pinned to its lowest allowed version.
            sed -E 's/>=/==/' requirements.txt > "$RUNNER_TEMP/requirements-minimum.txt"
            python -m pip install -r "$RUNNER_TEMP/requirements-minimum.txt" -r "$dev"
          else
            python -m pip install -r requirements.txt -r "$dev"
          fi
          python -m pip check

      - name: Show the environment
        run: python skills/resume-jd-tuner/scripts/check_env.py

      - name: Compile every file with this Python
        run: python -m compileall -q skills tools tests

      - name: Test
        run: python -m pytest -q -rs

  plugin:
    name: Plugin manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code (version and checksums from tools/claude-code/package-lock.json)
        run: npm ci --prefix tools/claude-code --no-audit --no-fund

      - name: Validate the plugin, the marketplace and the skill (strict)
        run: |
          claude="tools/claude-code/node_modules/.bin/claude"
          "$claude" plugin validate .claude-plugin/plugin.json --strict
          "$claude" plugin validate .claude-plugin/marketplace.json --strict
          "$claude" plugin validate skills --strict

  package:
    name: Upload zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check the versions agree
        run: python tools/release.py check

      - name: Build the zip and check its layout
        run: python tools/build_zip.py --check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resume-jd-tuner-skill
          path: dist/resume-jd-tuner.zip
          if-no-files-found: error
          retention-days: 30

  passed:
    # The one check that branch protection requires, so the matrix can change without
    # touching the repository settings.
    name: CI passed
    if: always()
    needs: [lint, test, plugin, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job finished with '$result'."
              exit 1
            fi
          done
