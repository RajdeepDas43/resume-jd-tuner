name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poppler and a minimal LaTeX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils texlive-latex-base

      - name: Install Python packages
        run: python -m pip install -r requirements.txt pytest pyyaml jsonschema ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build the skill zip
        run: python tools/build_zip.py

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: resume-jd-tuner-skill
          path: dist/resume-jd-tuner.zip
